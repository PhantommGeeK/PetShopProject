    <div class="admin-page" id="admin-pet-food-page">
      <div class="page-header"><h1>Manage Pet Food</h1><button class="btn btn-primary" (click)="openModal()">+ Add Food</button></div>
      <div class="table-wrapper">
        <div class="search-bar"><input placeholder="Search..." [(ngModel)]="searchTerm" (ngModelChange)="filter()"></div>
        <div style="overflow-x:auto"><table class="data-table">
          <thead><tr><th>ID</th><th>Name</th><th>Brand</th><th>Type</th><th>Qty</th><th>Price</th><th>Actions</th></tr></thead>
          <tbody><tr *ngFor="let f of filtered"><td>{{ f.foodId }}</td><td>{{ f.name }}</td><td>{{ f.brand }}</td><td>{{ f.type }}</td><td>{{ f.quantity }}</td><td>{{ f.price | currencyInr }}</td><td>
            <button class="btn btn-accent btn-sm" (click)="edit(f)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="confirmDel(f)" style="margin-left:4px">Delete</button>
          </td></tr></tbody>
        </table></div>
      </div>
      <div class="modal-overlay" *ngIf="showModal" (click)="showModal=false"><div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header"><h2>{{ editingId ? 'Edit' : 'Add' }} Food</h2><button class="modal-close" (click)="showModal=false">×</button></div>
        <form (ngSubmit)="save()">
          <div class="form-group"><label>Name</label><input [(ngModel)]="form.name" name="n" required></div>
          <div class="form-group"><label>Brand</label><input [(ngModel)]="form.brand" name="b" required></div>
          <div class="form-group"><label>Type</label><input [(ngModel)]="form.type" name="t" required></div>
          <div class="form-group"><label>Quantity</label><input type="number" [(ngModel)]="form.quantity" name="q" required></div>
          <div class="form-group"><label>Price</label><input type="number" [(ngModel)]="form.price" name="p" required></div>
          <button type="submit" class="btn btn-primary btn-full">{{ editingId ? 'Update' : 'Create' }}</button>
        </form>
      </div></div>
      <app-confirm-dialog [show]="showConfirm" (confirmed)="deleteItem()" (cancelled)="showConfirm=false"></app-confirm-dialog>
    </div>
