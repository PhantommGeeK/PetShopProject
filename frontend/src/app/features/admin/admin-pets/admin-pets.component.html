    <div class="admin-page" id="admin-pets-page">
      <div class="page-header">
        <h1>Manage Pets</h1>
        <div class="header-actions">
          <a routerLink="/admin/pet-categories" class="btn btn-outline btn-sm">Categories</a>
          <a routerLink="/admin/pet-food" class="btn btn-outline btn-sm">Food</a>
          <a routerLink="/admin/grooming" class="btn btn-outline btn-sm">Grooming</a>
          <a routerLink="/admin/vaccinations" class="btn btn-outline btn-sm">Vaccinations</a>
          <a routerLink="/admin/customers" class="btn btn-outline btn-sm">Customers</a>
          <a routerLink="/admin/employees" class="btn btn-outline btn-sm">Employees</a>
          <a routerLink="/admin/suppliers" class="btn btn-outline btn-sm">Suppliers</a>
          <a routerLink="/admin/transactions" class="btn btn-outline btn-sm">Transactions</a>
        </div>
      </div>
      <div class="page-header"><div></div><button class="btn btn-primary" (click)="openModal()">+ Add Pet</button></div>
      <div class="table-wrapper">
        <div class="search-bar"><input placeholder="Search pets..." [(ngModel)]="searchTerm" (ngModelChange)="filterPets()"></div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Name</th><th>Breed</th><th>Age</th><th>Price</th><th>Category</th><th>Actions</th></tr></thead>
            <tbody>
              <tr *ngFor="let p of filteredPets">
                <td>{{ p.petId }}</td><td>{{ p.name }}</td><td>{{ p.breed }}</td><td>{{ p.age }}</td>
                <td>{{ p.price | currencyInr }}</td><td>{{ p.category?.name || 'N/A' }}</td>
                <td>
                  <button class="btn btn-accent btn-sm" (click)="editPet(p)">Edit</button>
                  <button class="btn btn-danger btn-sm" (click)="confirmDel(p)" style="margin-left:4px">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Modal -->
      <div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
        <div class="modal-content" (click)="$event.stopPropagation()">
          <div class="modal-header"><h2>{{ editingId ? 'Edit' : 'Add' }} Pet</h2><button class="modal-close" (click)="showModal=false">×</button></div>
          <form (ngSubmit)="save()">
            <div class="form-group"><label>Name</label><input [(ngModel)]="form.name" name="name" required></div>
            <div class="form-group"><label>Breed</label><input [(ngModel)]="form.breed" name="breed" required></div>
            <div class="form-group"><label>Age</label><input type="number" [(ngModel)]="form.age" name="age" required></div>
            <div class="form-group"><label>Price</label><input type="number" [(ngModel)]="form.price" name="price" required></div>
            <div class="form-group"><label>Description</label><textarea [(ngModel)]="form.description" name="desc"></textarea></div>
            <div class="form-group"><label>Image URL</label><input [(ngModel)]="form.imageUrl" name="img"></div>
            <div class="form-group"><label>Category</label>
              <select [(ngModel)]="form.categoryId" name="cat" required>
                <option *ngFor="let c of categories" [ngValue]="c.categoryId">{{ c.name }}</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">{{ editingId ? 'Update' : 'Create' }}</button>
          </form>
        </div>
      </div>
      <app-confirm-dialog [show]="showConfirm" (confirmed)="deletePet()" (cancelled)="showConfirm=false"></app-confirm-dialog>
    </div>
