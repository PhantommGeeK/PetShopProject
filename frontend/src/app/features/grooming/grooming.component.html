    <div class="section" id="grooming-page">
      <h1 class="heading-two-tone">Grooming <span class="accent">Services</span></h1>

      <div class="toggle-bar">
        <button class="pill" [class.active]="!availableOnly" (click)="toggleFilter(false)">All Services</button>
        <button class="pill" [class.active]="availableOnly" (click)="toggleFilter(true)">Available Only</button>
        <button *ngIf="authService.hasAdminAccess()" class="btn btn-primary btn-sm" (click)="openModal()">+ Add Service</button>
      </div>

      <div class="service-grid stagger-children" *ngIf="!loading">
        <div class="service-card card" *ngFor="let s of services" [id]="'grooming-' + s.serviceId">
          <div class="service-icon">✂️</div>
          <h3>{{ s.name }}</h3>
          <p class="service-desc">{{ s.description }}</p>
          <div class="service-footer">
            <span class="service-price">{{ s.price | currencyInr }}</span>
            <span class="badge" [class.badge-unavailable]="!s.available">{{ s.available ? 'Available' : 'Unavailable' }}</span>
          </div>
          <div class="service-actions">
            <button class="btn btn-primary btn-sm" (click)="addToCart(s)" [disabled]="!s.available">Add to Cart</button>
          </div>
          <div class="service-actions" *ngIf="authService.hasAdminAccess()">
            <button class="btn btn-accent btn-sm" (click)="editService(s)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="confirmDel(s)">Delete</button>
          </div>
        </div>
      </div>

      <div class="service-grid" *ngIf="loading">
        <div class="skeleton-card" *ngFor="let s of [1,2,3]"><div class="skeleton" style="height:180px"></div></div>
      </div>

      <!-- Modal -->
      <div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
        <div class="modal-content" (click)="$event.stopPropagation()">
          <div class="modal-header"><h2>{{ editingId ? 'Edit' : 'Add' }} Service</h2><button class="modal-close" (click)="showModal=false">×</button></div>
          <form (ngSubmit)="save()">
            <div class="form-group"><label>Name</label><input [(ngModel)]="form.name" name="name" required></div>
            <div class="form-group"><label>Description</label><textarea [(ngModel)]="form.description" name="desc" required></textarea></div>
            <div class="form-group"><label>Price</label><input type="number" [(ngModel)]="form.price" name="price" required></div>
            <div class="form-group"><label><input type="checkbox" [(ngModel)]="form.available" name="avail"> Available</label></div>
            <button type="submit" class="btn btn-primary btn-full">{{ editingId ? 'Update' : 'Create' }}</button>
          </form>
        </div>
      </div>
      <app-confirm-dialog [show]="showConfirm" (confirmed)="deleteService()" (cancelled)="showConfirm=false"></app-confirm-dialog>
    </div>
