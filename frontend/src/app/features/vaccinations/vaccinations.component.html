    <div class="section" id="vaccinations-page">
      <h1 class="heading-two-tone">Pet <span class="accent">Vaccinations</span></h1>
      <div class="toggle-bar">
        <button class="pill" [class.active]="!availableOnly" (click)="toggleFilter(false)">All Vaccinations</button>
        <button class="pill" [class.active]="availableOnly" (click)="toggleFilter(true)">Available Only</button>
        <button *ngIf="authService.hasAdminAccess()" class="btn btn-primary btn-sm" (click)="openModal()">+ Add Vaccination</button>
      </div>
      <div class="vacc-grid stagger-children" *ngIf="!loading">
        <div class="vacc-card card" *ngFor="let v of vaccinations" [id]="'vacc-' + v.vaccinationId">
          <div class="vacc-icon">💉</div>
          <h3>{{ v.name }}</h3>
          <p class="vacc-desc">{{ v.description }}</p>
          <div class="vacc-footer">
            <span class="vacc-price">{{ v.price | currencyInr }}</span>
            <span class="badge" [class.badge-unavailable]="!v.available">{{ v.available ? 'Available' : 'Unavailable' }}</span>
          </div>
          <div class="vacc-actions">
            <button class="btn btn-primary btn-sm" (click)="addToCart(v)" [disabled]="!v.available">Add to Cart</button>
          </div>
          <div class="vacc-actions" *ngIf="authService.hasAdminAccess()">
            <button class="btn btn-accent btn-sm" (click)="editVacc(v)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="confirmDel(v)">Delete</button>
          </div>
        </div>
      </div>
      <div class="vacc-grid" *ngIf="loading">
        <div class="skeleton-card" *ngFor="let s of [1,2,3]"><div class="skeleton" style="height:180px"></div></div>
      </div>
      <!-- Modal -->
      <div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
        <div class="modal-content" (click)="$event.stopPropagation()">
          <div class="modal-header"><h2>{{ editingId ? 'Edit' : 'Add' }} Vaccination</h2><button class="modal-close" (click)="showModal=false">×</button></div>
          <form (ngSubmit)="save()">
            <div class="form-group"><label>Name</label><input [(ngModel)]="form.name" name="name" required></div>
            <div class="form-group"><label>Description</label><textarea [(ngModel)]="form.description" name="desc" required></textarea></div>
            <div class="form-group"><label>Price</label><input type="number" [(ngModel)]="form.price" name="price" required></div>
            <div class="form-group"><label><input type="checkbox" [(ngModel)]="form.available" name="avail"> Available</label></div>
            <button type="submit" class="btn btn-primary btn-full">{{ editingId ? 'Update' : 'Create' }}</button>
          </form>
        </div>
      </div>
      <app-confirm-dialog [show]="showConfirm" (confirmed)="deleteVacc()" (cancelled)="showConfirm=false"></app-confirm-dialog>
    </div>
