    <div class="section" id="pet-detail-page">
      <div class="detail-grid" *ngIf="pet">
        <div class="detail-image animate-in">
          <img *ngIf="pet.imageUrl" [src]="pet.imageUrl" [alt]="pet.name">
          <div *ngIf="!pet.imageUrl" class="img-placeholder">
            <svg viewBox="0 0 100 100" width="80" height="80" fill="currentColor"><circle cx="30" cy="20" r="10"/><circle cx="70" cy="20" r="10"/><circle cx="15" cy="45" r="8"/><circle cx="85" cy="45" r="8"/><ellipse cx="50" cy="70" rx="25" ry="20"/></svg>
          </div>
        </div>
        <div class="detail-info animate-in" style="animation-delay:0.15s">
          <h1>{{ pet.name }}</h1>
          <p class="detail-price">{{ pet.price | currencyInr }}</p>
          <div class="detail-meta">
            <span>🐕 Breed: <strong>{{ pet.breed }}</strong></span>
            <span>📅 Age: <strong>{{ pet.age }} years</strong></span>
          </div>
          <p class="detail-desc">{{ pet.description || 'A wonderful pet looking for a loving home.' }}</p>
          <div class="detail-actions">
            <button class="btn btn-primary" id="buy-now-btn">🛒 Buy Now</button>
            <button class="btn btn-outline" id="add-cart-detail">Add to Cart</button>
          </div>
        </div>
      </div>
      <!-- Loading -->
      <div class="detail-grid" *ngIf="loading">
        <div class="skeleton" style="height:400px;border-radius:var(--radius-md)"></div>
        <div><div class="skeleton" style="height:40px;width:60%;margin-bottom:16px"></div><div class="skeleton" style="height:30px;width:30%;margin-bottom:24px"></div><div class="skeleton" style="height:80px;margin-bottom:24px"></div><div class="skeleton" style="height:44px;width:50%"></div></div>
      </div>
      <!-- Related Pets -->
      <div *ngIf="relatedPets.length" class="related-section">
        <div class="divider-rule">Related Pets</div>
        <div class="pet-grid stagger-children">
          <app-pet-card *ngFor="let rp of relatedPets" [pet]="rp"></app-pet-card>
        </div>
      </div>
    </div>
