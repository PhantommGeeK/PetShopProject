    <div class="admin-page" id="admin-employees-page">
      <div class="page-header"><h1>Manage Employees</h1></div>
      <div class="table-wrapper">
        <div class="search-bar"><input placeholder="Search..." [(ngModel)]="searchTerm" (ngModelChange)="filter()"></div>
        <div style="overflow-x:auto"><table class="data-table">
          <thead><tr><th>ID</th><th>Name</th><th>Position</th><th>Email</th><th>Phone</th><th>Hire Date</th><th>Actions</th></tr></thead>
          <tbody><tr *ngFor="let e of filtered"><td>{{ e.employeeId }}</td><td>{{ e.firstName }} {{ e.lastName }}</td><td>{{ e.position }}</td><td>{{ e.email }}</td><td>{{ e.phoneNumber }}</td><td>{{ e.hireDate }}</td>
            <td><button class="btn btn-accent btn-sm" (click)="edit(e)">Edit</button><button class="btn btn-danger btn-sm" (click)="confirmDel(e)" style="margin-left:4px">Delete</button></td>
          </tr></tbody>
        </table></div>
      </div>
      <div class="modal-overlay" *ngIf="showModal" (click)="showModal=false"><div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header"><h2>Edit Employee</h2><button class="modal-close" (click)="showModal=false">×</button></div>
        <form (ngSubmit)="save()">
          <div class="form-group"><label>First Name</label><input [(ngModel)]="form.firstName" name="fn" required></div>
          <div class="form-group"><label>Last Name</label><input [(ngModel)]="form.lastName" name="ln" required></div>
          <div class="form-group"><label>Position</label><input [(ngModel)]="form.position" name="pos" required></div>
          <div class="form-group"><label>Hire Date</label><input type="date" [(ngModel)]="form.hireDate" name="hd" required></div>
          <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="form.email" name="em" required></div>
          <div class="form-group"><label>Phone</label><input [(ngModel)]="form.phoneNumber" name="ph" required></div>
          <div class="form-group"><label>Address ID</label><input type="number" [(ngModel)]="form.addressId" name="aid" required></div>
          <button type="submit" class="btn btn-primary btn-full">Update</button>
        </form>
      </div></div>
      <app-confirm-dialog [show]="showConfirm" (confirmed)="deleteItem()" (cancelled)="showConfirm=false"></app-confirm-dialog>
    </div>
