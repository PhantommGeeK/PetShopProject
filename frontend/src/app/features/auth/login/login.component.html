    <div class="auth-page" id="login-page">
      <div class="auth-card animate-scale">
        <div class="auth-logo">🐾</div>
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your PetShop account</p>
        <form (ngSubmit)="onLogin()" class="auth-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Enter your username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="toggle-pass" (click)="showPassword = !showPassword">{{ showPassword ? '🙈' : '👁️' }}</button>
            </div>
          </div>
          <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>
          <button type="submit" class="btn btn-primary btn-full" [disabled]="loading" id="login-submit">
            {{ loading ? 'Signing in...' : 'Login' }}
          </button>
        </form>
        <p class="auth-footer">Don't have an account? <a routerLink="/register">Register</a></p>
      </div>
    </div>
