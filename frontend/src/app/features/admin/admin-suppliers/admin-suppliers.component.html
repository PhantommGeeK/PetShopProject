    <div class="admin-page" id="admin-suppliers-page">
      <div class="page-header"><h1>Manage Suppliers</h1></div>
      <div class="table-wrapper">
        <div class="search-bar"><input placeholder="Search..." [(ngModel)]="searchTerm" (ngModelChange)="filter()"></div>
        <div style="overflow-x:auto"><table class="data-table">
          <thead><tr><th>ID</th><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
          <tbody><tr *ngFor="let s of filtered"><td>{{ s.supplierId }}</td><td>{{ s.name }}</td><td>{{ s.contactPerson }}</td><td>{{ s.email }}</td><td>{{ s.phoneNumber }}</td>
            <td>
              <button *ngIf="authService.isAdmin()" class="btn btn-accent btn-sm" (click)="edit(s)">Edit</button>
              <button *ngIf="authService.isAdmin()" class="btn btn-danger btn-sm" (click)="confirmDel(s)" style="margin-left:4px">Delete</button>
              <button class="btn btn-outline btn-sm" (click)="managePets(s)" style="margin-left:4px">Pets</button>
            </td>
          </tr></tbody>
        </table></div>
      </div>
      <!-- Edit Modal -->
      <div class="modal-overlay" *ngIf="showModal" (click)="showModal=false"><div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header"><h2>Edit Supplier</h2><button class="modal-close" (click)="showModal=false">×</button></div>
        <form (ngSubmit)="save()">
          <div class="form-group"><label>Name</label><input [(ngModel)]="form.name" name="n" required></div>
          <div class="form-group"><label>Contact Person</label><input [(ngModel)]="form.contactPerson" name="cp" required></div>
          <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="form.email" name="em" required></div>
          <div class="form-group"><label>Phone</label><input [(ngModel)]="form.phoneNumber" name="ph" required></div>
          <div class="form-group"><label>Address ID</label><input type="number" [(ngModel)]="form.addressId" name="aid" required></div>
          <button type="submit" class="btn btn-primary btn-full">Update</button>
        </form>
      </div></div>
      <!-- Pets Modal -->
      <div class="modal-overlay" *ngIf="showPetsModal" (click)="showPetsModal=false"><div class="modal-content" style="max-width:600px" (click)="$event.stopPropagation()">
        <div class="modal-header"><h2>Supplier Pets</h2><button class="modal-close" (click)="showPetsModal=false">×</button></div>
        <div class="assign-section">
          <div class="form-group" style="margin-bottom:12px">
            <ng-container *ngIf="authService.isAdmin()">
              <label>Assign Pet ID</label>
              <div style="display:flex;gap:8px"><input type="number" [(ngModel)]="assignPetId" style="flex:1"><button class="btn btn-primary btn-sm" (click)="assignPet()">Assign</button></div>
            </ng-container>
          </div>
          <h4 style="margin-bottom:8px">Current Pets:</h4>
          <div *ngIf="supplierPets.length === 0" style="color:var(--color-text-muted);font-size:0.9rem">No pets assigned.</div>
          <div *ngFor="let p of supplierPets" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--color-border)">
            <span>{{ p.name }} (ID: {{ p.petId }})</span>
            <button *ngIf="authService.isAdmin()" class="btn btn-danger btn-sm" (click)="removePet(p.petId)">Remove</button>
          </div>
        </div>
      </div></div>
      <app-confirm-dialog [show]="showConfirm" (confirmed)="deleteItem()" (cancelled)="showConfirm=false"></app-confirm-dialog>
    </div>
