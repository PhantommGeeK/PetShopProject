    <div class="section" id="pet-food-page">
      <h1 class="heading-two-tone">Pet <span class="accent">Food</span></h1>

      <!-- Type Filters -->
      <div class="type-filters">
        <button class="pill" [class.active]="selectedType===''" (click)="filterByType('')">All</button>
        <button *ngFor="let t of types" class="pill" [class.active]="selectedType===t" (click)="filterByType(t)">{{ t }}</button>
      </div>

      <button *ngIf="authService.hasAdminAccess()" class="btn btn-primary" style="margin-bottom:24px" (click)="openModal()">+ Add Food</button>

      <!-- Grid -->
      <div class="food-grid stagger-children" *ngIf="!loading">
        <div class="food-card card" *ngFor="let f of foods" [id]="'food-' + f.foodId">
          <div class="food-top">
            <img [src]="getFoodImage(f)" [alt]="f.name" class="food-image">
          </div>
          <div class="food-body">
            <h3>{{ f.name }}</h3>
            <p class="food-brand">{{ f.brand }}</p>
            <span class="badge">{{ f.type }}</span>
            <div class="food-meta">
              <span>Qty: {{ f.quantity }}</span>
              <span class="food-price">{{ f.price | currencyInr }}</span>
            </div>
            <div class="food-actions">
              <button class="btn btn-primary btn-sm" (click)="addToCart(f)">Add to Cart</button>
            </div>
            <div class="food-actions" *ngIf="authService.hasAdminAccess()">
              <button class="btn btn-accent btn-sm" (click)="editFood(f)">Edit</button>
              <button class="btn btn-danger btn-sm" (click)="confirmDelete(f)">Delete</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading -->
      <div class="food-grid" *ngIf="loading">
        <div class="skeleton-card" *ngFor="let s of [1,2,3,4,5,6]">
          <div class="skeleton" style="height:100px"></div>
          <div style="padding:16px"><div class="skeleton" style="height:20px;width:70%;margin-bottom:8px"></div><div class="skeleton" style="height:32px"></div></div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
        <div class="modal-content" (click)="$event.stopPropagation()">
          <div class="modal-header"><h2>{{ editingId ? 'Edit' : 'Add' }} Food</h2><button class="modal-close" (click)="showModal=false">×</button></div>
          <form (ngSubmit)="saveFood()">
            <div class="form-group"><label>Name</label><input [(ngModel)]="form.name" name="name" required></div>
            <div class="form-group"><label>Brand</label><input [(ngModel)]="form.brand" name="brand" required></div>
            <div class="form-group"><label>Type</label><input [(ngModel)]="form.type" name="type" required></div>
            <div class="form-group"><label>Quantity</label><input type="number" [(ngModel)]="form.quantity" name="qty" required></div>
            <div class="form-group"><label>Price</label><input type="number" [(ngModel)]="form.price" name="price" required></div>
            <button type="submit" class="btn btn-primary btn-full">{{ editingId ? 'Update' : 'Create' }}</button>
          </form>
        </div>
      </div>

      <app-confirm-dialog [show]="showConfirm" (confirmed)="deleteFood()" (cancelled)="showConfirm=false"></app-confirm-dialog>
    </div>
