
    <div class="section" id="order-page">
      <h1 class="heading-two-tone">Place <span class="accent">Order</span></h1>

      <div class="empty" *ngIf="!items.length">
        <p>Your cart is empty.</p>
        <a routerLink="/cart" class="btn btn-primary">Go to Cart</a>
      </div>

      <div class="order-layout" *ngIf="items.length">
        <section class="card checkout-form">
          <h2>Delivery Details</h2>
          <div class="form-group">
            <label>Full Name</label>
            <input [(ngModel)]="customerName" name="customerName" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input [(ngModel)]="phone" name="phone" placeholder="10-digit number" required>
          </div>
          <div class="form-group">
            <label>Address</label>
            <textarea [(ngModel)]="address" name="address" rows="4" placeholder="Complete address" required></textarea>
          </div>
          <button class="btn btn-primary btn-full" (click)="placeOrder()">Place Order</button>
        </section>

        <section class="card order-summary">
          <h2>Order Summary</h2>
          <div class="summary-item" *ngFor="let item of items">
            <div>
              <h3>{{ item.name }}</h3>
              <p>{{ item.itemType }} x {{ item.quantity }}</p>
            </div>
            <strong>{{ (item.price * item.quantity) | currencyInr }}</strong>
          </div>

          <div class="totals">
            <p>Total Items <strong>{{ totalCount }}</strong></p>
            <p>Total Amount <strong>{{ totalAmount | currencyInr }}</strong></p>
          </div>
        </section>
      </div>
    </div>
